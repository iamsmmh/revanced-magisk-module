name: Check Morphe patch updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: morphe-update-check
  cancel-in-progress: true

env:
  CONFIG_FILE: config.toml

jobs:
  check:
    name: Check configured patch sources
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a newer Morphe release
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git fetch origin update:refs/remotes/origin/update >/dev/null 2>&1; then
            git show origin/update:build.md > build.md 2>/dev/null || true
          fi
          if [ ! -s build.md ]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ./build.sh "$CONFIG_FILE" --config-update | grep -q .; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Remove old workflow runs
        if: ${{ steps.decision.outputs.should_build == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --limit 100 --json databaseId --jq '.[].databaseId' \
            | tail -n +11 \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/{}" || true

  build:
    name: Build and publish Morphe artifacts
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: config.toml
    secrets: inherit
