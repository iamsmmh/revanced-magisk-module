name: Build Morphe modules

on:
  workflow_call:
    inputs:
      config_file:
        description: TOML configuration file to build
        required: false
        type: string
        default: config.toml
  workflow_dispatch:
    inputs:
      config_file:
        description: TOML configuration file to build
        required: false
        type: string
        default: config.toml

permissions:
  contents: write

concurrency:
  group: morphe-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG_FILE: ${{ inputs.config_file || 'config.toml' }}

jobs:
  build:
    name: Build APKs and modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build utilities
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y jq zip unzip wget

      - name: Import optional Morphe Manager keystore
        env:
          MORPHE_KEYSTORE_B64: ${{ secrets.MORPHE_KEYSTORE_B64 }}
        run: |
          if [ -z "$MORPHE_KEYSTORE_B64" ]; then
            echo 'No MORPHE_KEYSTORE_B64 secret supplied; using the configured/default Morphe key.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/morphe-signing"
          printf '%s' "$MORPHE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/morphe-signing/Morphe.keystore"
          chmod 600 "$RUNNER_TEMP/morphe-signing/Morphe.keystore"
          echo "MORPHE_KEYSTORE=$RUNNER_TEMP/morphe-signing/Morphe.keystore" >> "$GITHUB_ENV"

      - name: Resolve release version code
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_tag=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          next_code=$(( ${last_tag:-0} + 1 ))
          echo "version_code=$next_code" >> "$GITHUB_OUTPUT"

      - name: Check whether a newer Morphe patch bundle is available
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_call' }}
        run: |
          if git fetch origin update:refs/remotes/origin/update >/dev/null 2>&1; then
            git show origin/update:build.md > build.md 2>/dev/null || true
          fi
          updated_config=$(./build.sh "$CONFIG_FILE" --config-update || true)
          if [ -n "$updated_config" ]; then
            printf '%s\n' "$updated_config" > "$CONFIG_FILE"
          fi

      - name: Build with Morphe Desktop and Morphe patches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.release.outputs.version_code }}
          MORPHE_KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
          MORPHE_KEYSTORE_ALIAS: ${{ secrets.MORPHE_KEYSTORE_ALIAS }}
          MORPHE_KEYSTORE_ENTRY_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_ENTRY_PASSWORD }}
          MORPHE_SIGNER: ${{ secrets.MORPHE_SIGNER }}
        run: ./build.sh "$CONFIG_FILE"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version_code }}
          name: Morphe Module Builder ${{ steps.release.outputs.version_code }}
          body_path: build.md
          files: build/*
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Publish module update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          cp -f build.md "$RUNNER_TEMP/morphe-build.md"
          git fetch origin update:refs/remotes/origin/update >/dev/null 2>&1 || true
          if git show-ref --verify --quiet refs/remotes/origin/update; then
            git switch --force-create update origin/update
          else
            git switch --force-create update
          fi
          cp -f "$RUNNER_TEMP/morphe-build.md" build.md
          shopt -s nullglob
          found=false
          for module in "$GITHUB_WORKSPACE"/build/*-module-*.zip; do
            found=true
            props=$(unzip -p "$module" module.prop)
            update_json_url=$(awk -F= '$1 == "updateJson" {print $2; exit}' <<< "$props")
            [ -n "$update_json_url" ] || continue
            update_json="${update_json_url##*/}"
            version=$(awk -F= '$1 == "version" {print $2; exit}' <<< "$props")
            file_name=$(basename "$module")
            jq -n \
              --arg version "$version" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_CODE/$file_name" \
              --arg changelog "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md" \
              --argjson code "$RELEASE_CODE" \
              '{version:$version,versionCode:$code,zipUrl:$url,changelog:$changelog}' > "$update_json"
          done
          $found || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f build.md
          find . -maxdepth 1 -type f -name '*-update.json' -print0 \
            | xargs -0 -r git add --
          git diff --cached --quiet || git commit -m "Publish Morphe build $RELEASE_CODE"
          git push origin HEAD:update
