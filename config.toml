# Morphe Module Builder configuration
#
# The builder uses the same Morphe patch bundles that Morphe Manager loads on
# Android. Every key is optional unless noted; see CONFIG.md for details.

# Release/update settings
enable-magisk-update = true
parallel-jobs = 1
compression-level = 9

# Morphe toolchain. Use "latest", "dev", or an exact tag such as "v1.14.0".
morphe-source = "MorpheApp/morphe-desktop"
morphe-version = "latest"
patches-source = "MorpheApp/morphe-patches"
patches-version = "latest"
morphe-brand = "Morphe"

# APK signing. Morphe creates a local default key when these are omitted.
# For updates between this builder and Morphe Manager, export the Manager key
# and set MORPHE_KEYSTORE plus the matching password/alias environment variables.
signer = "Morphe Module Builder"

# Safe defaults for compact, repeatable builds.
bytecode-mode = "STRIP_SAFE"
strip-libs = true
verify-source-signature = true

[YouTube]
enabled = true
app-name = "YouTube"
build-mode = "both"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

[YouTube-Music]
enabled = true
app-name = "YouTube Music"
build-mode = "both"
arch = "both"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"

[Reddit]
enabled = true
app-name = "Reddit"
build-mode = "both"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.reddit.frontpage"

# Uncomment a table to use a different Morphe-compatible patch source. The
# source must publish a .mpp release asset.
# [My-Custom-App]
# enabled = false
# app-name = "My Custom App"
# patches-source = "your-account/your-morphe-patches"
# patches-version = "latest"
# apkmirror-dlurl = "https://www.apkmirror.com/apk/example/app"
# included-patches = "'Remove ads' 'Custom branding'"
# excluded-patches = "'Experimental feature'"
# exclusive-patches = false
